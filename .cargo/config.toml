[build]
# Keep jumps inside 32-byte windows. On Skylake-derived CPUs with the JCC
# erratum fix, a jump that crosses or ends on a 32-byte boundary keeps its
# code out of the uop cache, and the decode loops change speed by ~10% with
# code placement alone.
rustflags = [
    "-C", "target-cpu=native",
    "-C", "llvm-args=--align-loops=32",
    "-C", "llvm-args=-x86-branches-within-32B-boundaries",
]
